<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340"><rect width="880" height="340" fill="white" /><g font-family="Lato,Arial,sans-serif"><g transform="translate(0 32) scale(1 0.90)"><text x="30" y="70" font-size="16" fill="#0A2373" font-weight="bold">Durban</text><rect x="135" y="125.05989230769231" width="62" height="24.940107692307695" fill="#546CA2" /><text x="135" y="168" font-size="11" fill="#767676">1 turns/mo</text><text x="135" y="117.05989230769231" font-size="13" fill="#0A2373" font-weight="bold">4.32</text><rect x="250" y="100.11978461538462" width="62" height="49.88021538461539" fill="#0A2373" /><text x="250" y="168" font-size="11" fill="#767676">2 turns/mo</text><text x="250" y="92.11978461538462" font-size="13" fill="#0A2373" font-weight="bold">8.65</text><rect x="365" y="75.17967692307691" width="62" height="74.82032307692309" fill="#767676" /><text x="365" y="168" font-size="11" fill="#767676">3 turns/mo</text><text x="365" y="67.17967692307691" font-size="13" fill="#0A2373" font-weight="bold">12.97</text><text x="30" y="190" font-size="16" fill="#0A2373" font-weight="bold">Lesedi</text><rect x="135" y="260.3076923076923" width="62" height="9.692307692307692" fill="#546CA2" /><text x="135" y="288" font-size="11" fill="#767676">1 turns/mo</text><text x="135" y="252.30769230769232" font-size="13" fill="#0A2373" font-weight="bold">1.68</text><rect x="250" y="250.6153846153846" width="62" height="19.384615384615383" fill="#0A2373" /><text x="250" y="288" font-size="11" fill="#767676">2 turns/mo</text><text x="250" y="242.6153846153846" font-size="13" fill="#0A2373" font-weight="bold">3.36</text><rect x="365" y="240.92307692307693" width="62" height="29.076923076923077" fill="#767676" /><text x="365" y="288" font-size="11" fill="#767676">3 turns/mo</text><text x="365" y="232.92307692307693" font-size="13" fill="#0A2373" font-weight="bold">5.04</text><text x="30" y="337" font-size="12" fill="#767676">bn litres/year; 1 / 2 / 3 monthly turns are an existing authored sensitivity, not measured site limits.</text></g><text x="30" y="20" font-size="13" fill="#000000" font-weight="700">Gross handling sensitivity</text><text x="540" y="20" font-size="13" fill="#000000" font-weight="700">Investment test</text><path d="M510 42L510 302" stroke="#555555" stroke-width="0.6" fill="none" /><circle cx="510" cy="31" r="10" fill="#0A2373" /><path d="M508 26l5 5-5 5" stroke="#FFFFFF" fill="none" stroke-width="1.3" /><text x="540" y="64" fill="#595959" font-size="12" font-weight="700">01 | Calculate required turns</text><text x="540" y="85" fill="#595959" font-size="11.5" font-weight="400">Captured annual throughput divided by</text><text x="540" y="101" fill="#595959" font-size="11.5" font-weight="400">eligible working capacity, then by 12.</text><text x="540" y="129" fill="#595959" font-size="12" font-weight="700">02 | Test achievable handling</text><text x="540" y="150" fill="#595959" font-size="11.5" font-weight="400">Check receipt / dispatch, pipeline access,</text><text x="540" y="166" fill="#595959" font-size="11.5" font-weight="400">seasonal peaks and stock policy.</text><text x="540" y="194" fill="#595959" font-size="12" font-weight="700">03 | Identify the binding constraint</text><text x="540" y="215" fill="#595959" font-size="11.5" font-weight="400">Use existing assets first; debottleneck or</text><text x="540" y="231" fill="#595959" font-size="11.5" font-weight="400">add tanks where the constraint is profitable.</text><path d="M540 260H855" stroke="#546CA2" stroke-width=".8" /><text x="540" y="280" fill="#595959" font-size="13" font-weight="700">Next action</text><text x="540" y="302" fill="#595959" font-size="11.5" font-weight="400">Confirm working tankage and achieved turns</text><text x="540" y="318" fill="#595959" font-size="11.5" font-weight="400">before sizing any additional storage.</text></g></svg>