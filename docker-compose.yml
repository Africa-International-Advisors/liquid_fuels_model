# Internal documentation viewer. No model execution or data-editing endpoints.
services:
  lfm-docs:
    container_name: lfm-docs
    image: lfm-docs:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      LFM_DOCS_ROOT: /content
    volumes:
      - ./README.md:/content/README.md:ro
      - ./CLAUDE.md:/content/CLAUDE.md:ro
      - ./docs/methodology/demand_hypothesis_tree.md:/content/docs/methodology/demand_hypothesis_tree.md:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
