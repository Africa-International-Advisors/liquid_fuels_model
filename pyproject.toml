[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfm"
version = "0.2.0"
description = "SACU liquid fuels supply-demand model (rebuild of the Vopak/Reatile xlsx)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nigel Zhuwaki" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
data = [
    "pypdf>=4.0",
    "cryptography>=3.1",
    "xlrd>=2.0",
]


[project.scripts]
lfm = "lfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
