# Macro drivers — GDP, GDP/capita, FX, population — per SACU country.
#
# Schema reminder for every assumption:
#   value | csv      : either inline value/table, or path (relative to this file)
#                      to a CSV containing the long time series.
#   units            : human-readable unit string.
#   source           : where the number originated (Stats SA, NamPower, IEA, ...).
#   last_updated     : ISO date of source publication or analyst pull.
#   scenarios        : list of scenarios this value applies to. Use `shared: true`
#                      when a value is invariant across scenarios.
#   expand           : annual->monthly rule. One of:
#                        kind: flat
#                        kind: linear
#                        kind: seasonal
#                        seasonal_index: <name in seasonality/>

gdp:
  register_id: REG-MACRO-GDP
  exception_id: EXC-MACRO-GDP
  owner: nigel.zhuwaki
  confidence: unassessed
  csv: timeseries/gdp.csv
  units: ZAR (constant 2015)
  source: Vopak/Reatile xlsx (GDP named range); BLNS to be sourced
  last_updated: 2025-03-24
  scenarios: [high_demand, low_demand]
  expand:
    kind: linear

gdp_per_capita:
  register_id: REG-MACRO-GDP_PER_CAPITA
  exception_id: EXC-MACRO-GDP_PER_CAPITA
  owner: nigel.zhuwaki
  confidence: unassessed
  csv: timeseries/gdp_per_capita.csv
  units: ZAR (constant 2015) per capita
  source: Vopak/Reatile xlsx (GDP named range, GDP/capita columns); BLNS to be sourced
  last_updated: 2025-03-24
  scenarios: [high_demand, low_demand]
  expand:
    kind: linear

gdp_growth:
  register_id: REG-MACRO-GDP_GROWTH
  exception_id: EXC-MACRO-GDP_GROWTH
  owner: nigel.zhuwaki
  confidence: unassessed
  csv: timeseries/gdp_growth.csv
  units: fraction per year (real GDP growth)
  source: Vopak/Reatile xlsx (GDP_high_growth / GDP_low_growth); BLNS to be sourced
  last_updated: 2025-03-24
  scenarios: [high_demand, low_demand]
  expand:
    kind: flat

population:
  register_id: REG-MACRO-POPULATION
  exception_id: EXC-MACRO-POPULATION
  owner: nigel.zhuwaki
  confidence: unassessed
  csv: timeseries/population.csv
  units: persons
  source: Vopak/Reatile xlsx (GDP named range, Population columns); BLNS to be sourced
  last_updated: 2025-03-24
  scenarios: [high_demand, low_demand]
  expand:
    kind: linear

fx_zar_usd:
  register_id: REG-MACRO-FX_ZAR_USD
  exception_id: EXC-MACRO-FX_ZAR_USD
  owner: nigel.zhuwaki
  confidence: unassessed
  value: null   # placeholder — not in xlsx as a forecast series
  units: ZAR per USD
  source: TBD (SARB annual average)
  last_updated: null
  shared: true
  expand:
    kind: flat

crude_oil_litres_per_barrel:
  register_id: REG-MACRO-CRUDE_OIL_LITRES_PER_BARREL
  exception_id: EXC-MACRO-CRUDE_OIL_LITRES_PER_BARREL
  owner: nigel.zhuwaki
  confidence: unassessed
  value: 158.987
  units: litres per barrel
  source: Vopak/Reatile xlsx (Crude_oil_litresPerBarrel)
  last_updated: 2025-03-24
  shared: true
  expand:
    kind: flat

gdp_growth_beyond_official_forecast:
  register_id: REG-MACRO-GDP_GROWTH_BEYOND_OFFICIAL_FORECAST
  exception_id: EXC-MACRO-GDP_GROWTH_BEYOND_OFFICIAL_FORECAST
  owner: nigel.zhuwaki
  confidence: unassessed
  # Real GDP growth applied to every year after the last year National
  # Treasury forecasts (timeseries/gdp_growth_treasury.csv; 2028 in the
  # Budget Review 2026). Treasury publishes three forecast years only, so
  # this is a base-case assumption, not a published figure. It equals
  # Treasury's last forecast year (2.0% for 2028).
  value: 0.02
  units: fraction per year (real GDP growth)
  source: Base-case assumption set by the engagement team on 5 October 2026; equal to National Treasury's 2028 forecast (Budget Review 2026, chapter 2)
  last_updated: 2026-10-05
  scenarios: [base]
  expand:
    kind: flat

population_growth_beyond_official_estimates:
  register_id: REG-MACRO-POPULATION_GROWTH_BEYOND_OFFICIAL_ESTIMATES
  exception_id: EXC-MACRO-POPULATION_GROWTH_BEYOND_OFFICIAL_ESTIMATES
  owner: nigel.zhuwaki
  confidence: unassessed
  # Statistics South Africa's mid-year estimates stop at the release year
  # (2026). Later years continue the average annual growth of the last
  # `years` years of the Stats SA series. Applied by scripts/fetch_economy.py,
  # which writes the result to timeseries/macro_statssa.csv.
  value:
    method: average annual growth of the Stats SA series, continued
    years: 5
  units: years averaged over
  source: Base-case assumption set by the engagement team on 5 October 2026 (continue Stats SA's own recent growth rate). The five-year window was proposed, not yet confirmed.
  last_updated: 2026-10-05
  scenarios: [base]
