# Aviation segment — MODELLED in v1 via the xlsx's two-variable regression.
#
# The xlsx fits jet fuel demand directly: aviation ≈ jet (paraffin and avgas
# are small). For SACU v1, the regression IS the aviation segment's logic
# for ZAF; BLNS will need separately fitted coefficients or a held-segment
# fallback until data is available.

regression:
  register_id: REG-AVIATION-REGRESSION
  exception_id: EXC-AVIATION-REGRESSION
  owner: nigel.zhuwaki
  confidence: unassessed
  # JetFuel(t) = intercept + b_gdp_pc * GDP_per_capita(t) + b_pax * PassengerDepartures(t)
  #
  # Source: xlsx sheet `RegJetFuel` / named-range coefficients.
  by_country:
    ZAF:
      intercept:           -14746408795.767437
      coefficients:
        gdp_per_capita:    196334.9338396717
        passenger_departures: 79.78786549099274
      r_squared:           0.94602
      observations:        6
    BWA: null
    LSO: null
    NAM: null
    SWZ: null
  units: litres per year (response); ZAR/capita and pax (drivers)
  source: Vopak/Reatile xlsx (RegJetFuel sheet)
  last_updated: 2025-03-24
  shared: true            # coefficients invariant across scenarios; drivers vary
  expand:
    kind: flat

passenger_departures:
  register_id: REG-AVIATION-PASSENGER_DEPARTURES
  exception_id: EXC-AVIATION-PASSENGER_DEPARTURES
  owner: nigel.zhuwaki
  confidence: unassessed
  # Driver series for the regression. Historical observed departures plus
  # the xlsx's base-scenario forecast path.
  csv: timeseries/passenger_departures.csv
  units: pax per year
  source: Vopak/Reatile xlsx (PaxBaseScenario)
  last_updated: 2025-03-24
  shared: true
  expand:
    kind: linear

product_split:
  register_id: REG-AVIATION-PRODUCT_SPLIT
  exception_id: EXC-AVIATION-PRODUCT_SPLIT
  owner: nigel.zhuwaki
  confidence: unassessed
  source: Legacy configuration; original source not recorded
  # Aviation segment emits one product (Jet A1) for v1. Aviation gasoline
  # and paraffin are immaterial at SACU scale and rolled into jet.
  by_country:
    ZAF: { jet_a1: 1.0 }
    BWA: { jet_a1: 1.0 }
    LSO: { jet_a1: 1.0 }
    NAM: { jet_a1: 1.0 }
    SWZ: { jet_a1: 1.0 }
  units: fraction (sums to 1 per country)
  shared: true
  expand:
    kind: flat

seasonality:
  register_id: REG-AVIATION-SEASONALITY
  exception_id: EXC-AVIATION-SEASONALITY
  owner: nigel.zhuwaki
  confidence: unassessed
  units: not recorded
  # Dec-Feb peak (southern-summer tourism), secondary Jul-Aug.
  # Indices to be fitted from history.
  by_country:
    ZAF: aviation_za
    BWA: aviation_bw
    LSO: aviation_ls
    NAM: aviation_na
    SWZ: aviation_sz
  source: fitted from history (see seasonality/ CSVs)
  last_updated: null
  shared: true

# --------------------------------------------------------------------------- #
# Base-case driver decision, 5 October 2026
#
# Jet fuel in the base case is to be driven by AIRCRAFT MOVEMENTS (departing
# flights by type: international, regional, domestic, unscheduled), not by
# passenger numbers alone. Fuel is burned per flight, so movements also pick
# up scheduled freighters and cargo carried in passenger aircraft.
# Source: timeseries/air_traffic_acsa_annual.csv (ACSA, nine airports).
# The regression above was fitted on GDP per capita and total departing
# passengers and has to be re-estimated on the new data before use.
#
# OPEN ITEM — CARGO. Still to be worked out. No usable published series of air
# cargo tonnage or freighter movements was found (checked: ACSA statistics
# files and integrated report 2024/25, World Bank air freight indicator).
# Leads not yet followed: the weekly Cargo Movement Updates published by the
# business and freight associations (air cargo kilograms at OR Tambo), and a
# direct request to ACSA or the civil aviation authority. Until then cargo is
# covered only indirectly, through aircraft movements.
driver_decision:
  register_id: REG-AVIATION-DRIVER_DECISION
  exception_id: EXC-AVIATION-DRIVER_DECISION
  owner: nigel.zhuwaki
  confidence: unassessed
  value:
    jet_driver: aircraft_movements
    cargo_status: open — no source yet; covered indirectly through movements
    decided: 2026-10-05
  source: Manish base-case driver proposal, 5 October 2026; ACSA group traffic statistics
  last_updated: '2026-10-05'
  units: driver choice and unresolved cargo status
  shared: true
