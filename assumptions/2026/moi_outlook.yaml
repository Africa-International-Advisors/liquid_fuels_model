  source: "Henry Gilfillan, 14 October 2026 check-in: the drop in industrial diesel once load shedding stopped is all generator diesel; treat it as going from stage 6 load shedding to none, and extrapolate for a return of load shedding. Installed generator capacity is not published, so not used. Generator diesel = fall in national diesel (production + imports - exports) less fall in Eskom + IPP peaker diesel, 2023 to 2024; peakers by FY ending the next March (9 of 12 months). Base: no load shedding by 2030 (Henry Gilfillan, 13 October 2026); High: stage 6 returns (Manish Ramjeawon, 15 October 2026)"
  value:
    years: [2023, 2024]
    level: {Low: 0.0, Base: 0.0, High: 1.0}
