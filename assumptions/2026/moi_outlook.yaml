ev_scurves:
  register_id: REG-MOI-OUTLOOK-EV
  exception_id: EXC-MOI-OUTLOOK-2026-10-15
  owner: manish.r@africaia.com
  confidence: unassessed
  provisional: true
  shared: true
  last_updated: '2026-10-15'
  units: logistic EV share of new light-vehicle sales (ceiling, slope in years); midpoint set so each curve passes the anchor-year actual; anchor share is of new cars (scaled to cars + LCVs by the eNaTIS 2025 car share of new light vehicles); Base = average of Low and High
  source: "Ceilings and slopes: Vopak/Reatile xlsx EV_High_Penetration (Low demand) and EV_Low_Penetration (High demand), see _meta.yaml. Anchor: South Africa 0.88% of new cars electric (BEV + PHEV) in 2025, IEA Global EV Outlook 2026 via Our World in Data (external/data/raw/ev_benchmark_20261015). Anchoring replaces the workbook midpoints (2036, 2040), which started below the 2025 actual (Manish Ramjeawon, 15 October 2026). No electric trucks to 2030: IEA GEVO 2026 has Europe heavy trucks at about 1.5% of sales in 2025. Benchmarks (same source): electric share of new cars five years after first reaching South Africa's 2025 level, world 2015-2020 4.4%, China 2015-2020 5.7%, Germany 2015-2020 14% (purchase subsidies), Brazil 2021-2025 9.0% (four years). Each case's share of new cars in check_year must sit in its band: slow (High demand) at or below China, base between China and Brazil, fast (Low demand) between Brazil and Germany (pack p23; Manish Ramjeawon, 15 October 2026)"
  value:
    anchor_year: 2025
    anchor_car_share: 0.0088
    Low: {ceiling: 0.90, slope: 2}
    High: {ceiling: 0.30, slope: 3}
    check_year: 2030
    benchmarks: {world: 0.044, china: 0.057, brazil: 0.090, germany: 0.14}
    bands: {High: [null, china], Base: [china, brazil], Low: [brazil, germany]}

