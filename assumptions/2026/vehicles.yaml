# Vehicles segment — modelled in v1.
#
# Three vehicle segments: passenger / lcv (light commercial) / hcv (heavy commercial).
# Per-segment values capture that LCVs are heavily diesel and HCVs almost entirely
# diesel, which a single aggregate would smear out.
#
# Values flagged `provisional: true` are LITERATURE-RANGE PLACEHOLDERS sufficient
# for engine implementation but NOT for decision-grade output. Tracking sheet:
# `docs/params_sourcing.md`. Outputs computed off provisional inputs
# must carry a "PROVISIONAL" banner.

ev_scurve:
  # Logistic / Boltzmann S-curve parameters per country, per scenario.
  # penetration(t) = 1 / (1 + exp((midpoint - t) / slope))
  #
  # NOTE: methodology note describes both scenarios as midpoint 2040 / slope 3,
  # but the xlsx itself defines `EV_High_Penetration` as midpoint 2036 / slope 2.
  # The xlsx is treated as the source of truth here.
  by_country:
    ZAF:
      by_scenario:
        high_demand: { max_penetration: 0.30, midpoint: 2040, slope: 3 }  # xlsx: EV_Low_Penetration
        low_demand:  { max_penetration: 0.90, midpoint: 2036, slope: 2 }  # xlsx: EV_High_Penetration
    BWA:
      by_scenario:
        high_demand: { max_penetration: null, midpoint: null, slope: null }
        low_demand:  { max_penetration: null, midpoint: null, slope: null }
    LSO:
      by_scenario:
        high_demand: { max_penetration: null, midpoint: null, slope: null }
        low_demand:  { max_penetration: null, midpoint: null, slope: null }
    NAM:
      by_scenario:
        high_demand: { max_penetration: null, midpoint: null, slope: null }
        low_demand:  { max_penetration: null, midpoint: null, slope: null }
    SWZ:
      by_scenario:
        high_demand: { max_penetration: null, midpoint: null, slope: null }
        low_demand:  { max_penetration: null, midpoint: null, slope: null }
  units: ratio (penetration), year (midpoint)
  source: Vopak/Reatile xlsx (EV_High_Penetration / EV_Low_Penetration); BLNS to be sourced
  last_updated: 2025-03-24
  scenarios: [high_demand, low_demand]
  expand:
    kind: flat

new_vehicle_regression:
  # NewVehicleDemand = slope * GDP_per_capita + intercept
  #
  # Regression coefficients are shared across scenarios; what varies between
  # scenarios is the GDP/capita series fed in (see macro.yaml).
  by_country:
    ZAF: { slope: 37.3149, intercept: -2387744, r_squared: 0.511137 }   # xlsx: RegEV / fEV Penetration
    BWA: { slope: null, intercept: null, r_squared: null }
    LSO: { slope: null, intercept: null, r_squared: null }
    NAM: { slope: null, intercept: null, r_squared: null }
    SWZ: { slope: null, intercept: null, r_squared: null }
  units: vehicles per year (response), ZAR-per-capita constant 2015 (driver)
  source: Vopak/Reatile xlsx (RegEV); BLNS to be fitted
  last_updated: 2025-03-24
  shared: true            # same coeffs apply to both scenarios
  expand:
    kind: flat

# --- segment-level fleet parameters ----------------------------------------- #
# Three segments: passenger / lcv / hcv. The xlsx does not break these out;
# values come from external sources (or provisional literature placeholders).

annual_km_per_vehicle:
  by_country:
    ZAF: { passenger: 17000, lcv: 28000, hcv: 70000 }
    BWA: { passenger: null,  lcv: null,  hcv: null  }
    LSO: { passenger: null,  lcv: null,  hcv: null  }
    NAM: { passenger: null,  lcv: null,  hcv: null  }
    SWZ: { passenger: null,  lcv: null,  hcv: null  }
  units: km per vehicle per year
  provisional: true
  needs_verification: true
  source: PROVISIONAL — literature mid-range placeholders pending teammate lookup (eNaTIS odometer queries / GreenCape / NAAMSA / IEA MoMo). See docs/params_sourcing.md
  last_updated: null
  shared: true
  expand:
    kind: flat

fuel_consumption:
  # Litres per 100 km, by segment and powertrain. HCV petrol is null because
  # heavy commercial vehicles in SACU are essentially all diesel.
  #
  # APPLICATION RULE (locked): the values here are the BASELINE for new-sale
  # entries to the fleet. The `efficiency_improvement_*` annual paths (below)
  # apply to NEW ENTRIES ONLY — i.e. each cohort's L/100km is fixed at the
  # year-of-manufacture baseline times the cumulative efficiency improvement
  # up to that year, then held for the cohort's life. The fleet-average
  # L/100km in any given year emerges as a stock-weighted sum across cohorts.
  # This implies the vehicles compute must track vehicle stock by cohort
  # (year-of-first-registration), not as a single bulk number.
  by_country:
    ZAF:
      passenger: { ice_petrol: 9.5,  ice_diesel: 7.5  }
      lcv:       { ice_petrol: 10.5, ice_diesel: 9.0  }
      hcv:       { ice_petrol: null, ice_diesel: 35.0 }
    BWA:
      passenger: { ice_petrol: null, ice_diesel: null }
      lcv:       { ice_petrol: null, ice_diesel: null }
      hcv:       { ice_petrol: null, ice_diesel: null }
    LSO:
      passenger: { ice_petrol: null, ice_diesel: null }
      lcv:       { ice_petrol: null, ice_diesel: null }
      hcv:       { ice_petrol: null, ice_diesel: null }
    NAM:
      passenger: { ice_petrol: null, ice_diesel: null }
      lcv:       { ice_petrol: null, ice_diesel: null }
      hcv:       { ice_petrol: null, ice_diesel: null }
    SWZ:
      passenger: { ice_petrol: null, ice_diesel: null }
      lcv:       { ice_petrol: null, ice_diesel: null }
      hcv:       { ice_petrol: null, ice_diesel: null }
  units: L / 100 km
  provisional: true
  needs_verification: true
  source: PROVISIONAL — literature mid-range placeholders pending teammate lookup (DMRE/DoE energy balances, IEA MoMo, NAAMSA-weighted OEM averages). See docs/params_sourcing.md
  last_updated: null
  shared: true             # base fleet-average; efficiency_improvement applied annually on top
  expand:
    kind: flat

petrol_diesel_split:
  # Fraction of new ICE sales that are petrol vs diesel, per segment.
  by_country:
    ZAF:
      passenger: { petrol: 0.83, diesel: 0.17 }
      lcv:       { petrol: 0.30, diesel: 0.70 }
      hcv:       { petrol: 0.00, diesel: 1.00 }
    BWA:
      passenger: { petrol: null, diesel: null }
      lcv:       { petrol: null, diesel: null }
      hcv:       { petrol: null, diesel: null }
    LSO:
      passenger: { petrol: null, diesel: null }
      lcv:       { petrol: null, diesel: null }
      hcv:       { petrol: null, diesel: null }
    NAM:
      passenger: { petrol: null, diesel: null }
      lcv:       { petrol: null, diesel: null }
      hcv:       { petrol: null, diesel: null }
    SWZ:
      passenger: { petrol: null, diesel: null }
      lcv:       { petrol: null, diesel: null }
      hcv:       { petrol: null, diesel: null }
  units: fraction (sums to 1 per country×segment)
  provisional: true
  needs_verification: true
  source: PROVISIONAL — literature mid-range placeholders pending teammate lookup (NAAMSA monthly sales reports). See docs/params_sourcing.md
  last_updated: null
  shared: true
  expand:
    kind: flat

scrappage_rate:
  # Annual fraction of fleet retired. v1 uses a flat rate per segment as
  # a simplification; a Weibull/logistic survival curve is a future upgrade.
  by_country:
    ZAF: { passenger: 0.04, lcv: 0.05, hcv: 0.06 }
    BWA: { passenger: null, lcv: null, hcv: null }
    LSO: { passenger: null, lcv: null, hcv: null }
    NAM: { passenger: null, lcv: null, hcv: null }
    SWZ: { passenger: null, lcv: null, hcv: null }
  units: fraction per year
  provisional: true
  needs_verification: true
  source: PROVISIONAL — literature mid-range placeholders pending teammate lookup (eNaTIS deregistrations / SA vehicle-stock-turnover papers). See docs/params_sourcing.md
  last_updated: null
  shared: true
  expand:
    kind: flat

new_vehicle_segment_split:
  # Fraction of total new-vehicle demand falling into each segment.
  # Needed because the EV/new-vehicle regression yields a single aggregate
  # number; we then split that into passenger/lcv/hcv to apply per-segment
  # consumption and km parameters.
  by_country:
    ZAF: { passenger: 0.78, lcv: 0.18, hcv: 0.04 }
    BWA: { passenger: null, lcv: null, hcv: null }
    LSO: { passenger: null, lcv: null, hcv: null }
    NAM: { passenger: null, lcv: null, hcv: null }
    SWZ: { passenger: null, lcv: null, hcv: null }
  units: fraction (sums to 1 per country)
  provisional: true
  needs_verification: true
  source: PROVISIONAL — literature mid-range placeholders pending teammate lookup (NAAMSA new-vehicle registrations split by segment). See docs/params_sourcing.md
  last_updated: null
  shared: true
  expand:
    kind: flat

efficiency_improvement:
  # Annual efficiency improvement applied to NEW-SALE entries only — see the
  # APPLICATION RULE comment on `fuel_consumption` above. Each new cohort's
  # L/100km = baseline * cumulative_product(1 - improvement) over years.
  # Sourced from the xlsx Assumptions sheet's High/Low demand scenario columns.
  diesel:
    csv: timeseries/efficiency_improvement_diesel.csv
    units: fraction per year
    source: Vopak/Reatile xlsx (HighEfficiency_Improvement_Diesel / LowEfficiency_Improvement_Diesel)
    last_updated: 2025-03-24
    scenarios: [high_demand, low_demand]
    expand:
      kind: flat
  gasoline:
    csv: timeseries/efficiency_improvement_gasoline.csv
    units: fraction per year
    source: Vopak/Reatile xlsx (HighEfficiency_Improvement_Gasoline / LowEfficiency_Improvement_Gasoline)
    last_updated: 2025-03-24
    scenarios: [high_demand, low_demand]
    expand:
      kind: flat
