# Industrial / mining diesel — held with GDP-ratio growth in v1.
#
# v1 simplification: single aggregate bucket per country (mining + manufacturing
# + construction lumped together). Sub-segments (mining haul, smelters, etc.)
# are a future enhancement.
#
# Compute: volume(t) = base_year_volume * (gdp_pc(t) / gdp_pc(base_year))^elasticity

base_year_volume:
  register_id: REG-INDUSTRIAL-BASE_YEAR_VOLUME
  exception_id: EXC-INDUSTRIAL-BASE_YEAR_VOLUME
  owner: nigel.zhuwaki
  confidence: unassessed
  by_country:
    ZAF: { value: 1499139260, year: 2021 }   # energy balance 2021, industry sector (mining 1 293 813 000)
    BWA: { value: null,   year: null }
    LSO: { value: null,   year: null }
    NAM: { value: null,   year: null }
    SWZ: { value: null,   year: null }
  units: litres per year (diesel)
  provisional: false
  needs_verification: true
  source: Department of Mineral and Petroleum Resources, 2021 Commodity Flow and Energy Balance, diesel, "Industry" (timeseries/energy_balance_department.csv). Replaces an unsourced 2.5e9 placeholder for 2024. The balance ends in 2021 and its sector boundaries shift in 2016. Awaiting review.
  last_updated: 2026-10-06
  shared: true

elasticity:
  register_id: REG-INDUSTRIAL-ELASTICITY
  exception_id: EXC-INDUSTRIAL-ELASTICITY
  owner: nigel.zhuwaki
  confidence: unassessed
  by_country:
    ZAF: 1.0    # provisional — industrial diesel grows roughly 1:1 with GDP
    BWA: null
    LSO: null
    NAM: null
    SWZ: null
  units: dimensionless (response of diesel demand to GDP/capita)
  provisional: true
  needs_verification: true
  source: PROVISIONAL — literature mid-range; varies 0.5–1.2 across studies. See docs/methodology/params_sourcing.md
  last_updated: null
  shared: true

product:
  register_id: REG-INDUSTRIAL-PRODUCT
  exception_id: EXC-INDUSTRIAL-PRODUCT
  owner: nigel.zhuwaki
  confidence: unassessed
  source: Legacy configuration; original source not recorded
  # All industrial output goes to diesel_50ppm in v1.
  default: diesel_50ppm
  units: product code
  shared: true

seasonality:
  register_id: REG-INDUSTRIAL-SEASONALITY
  exception_id: EXC-INDUSTRIAL-SEASONALITY
  owner: nigel.zhuwaki
  confidence: unassessed
  units: not recorded
  # Industrial diesel has weak monthly seasonality (mining maintenance windows,
  # agri spillover). Flat for v1.
  by_country:
    ZAF: null
    BWA: null
    LSO: null
    NAM: null
    SWZ: null
  source: TBD (would be fitted from monthly DMRE wholesale data per region)
  last_updated: null
  shared: true
