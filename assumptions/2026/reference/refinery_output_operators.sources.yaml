limits:
- All refined products together; neither operator publishes a split by product.
- Sasol's year runs July to June; Glencore's is the calendar year.
- Natref is Sasol's reported production. To FY2025 that is its 63.64% share; the whole refinery is the
  figure divided by 0.6364. FY2026 includes 6.9 million barrels above the share.
- Astron is reported as energy content. Litres need an assumed energy content per litre.
- Astron did not operate in 2022; the 2023 report prints a dash for that year.
- Glencore's 2025 report also says sold products processed by Astron rose 28% in 2025, which does not
  sit with the 1% fall in energy content; not reconciled.
