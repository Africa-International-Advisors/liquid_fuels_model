what_it_is: The Road Accident Fund levy is charged in cents per litre on petrol and diesel sold in South
  Africa. Gross levies divided by the rate gives litres levied; it is not a sales survey.
reported_units_only: rand and cents per litre as printed; litres are derived in the notes, not stored
  here
limits:
- fiscal years April to March, not calendar years
- petrol and diesel together; no split by product
- accrual basis; cash received was lower in 2024/25 and SARS withheld R995 million in a dispute over Eskom
- whether the base includes fuel later exported to neighbouring countries is not stated
