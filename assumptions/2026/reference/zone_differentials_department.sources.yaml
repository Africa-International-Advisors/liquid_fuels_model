publisher: Department of Mineral and Petroleum Resources
page: https://www.dmpr.gov.za/Portals/0/Energy_Website/files/esources/petroleum/petroleum_fuelprices.html
retrieved: '2026-10-08'
originals:
- external/data/raw/routes_access_20261008/department-diesel-wholesale-by-zone-2024-04.pdf
- external/data/raw/routes_access_20261008/department-transport-cost-by-zone-2014-04-02.xls
command: python -m lfm.scripts.stage_zone_differentials --vintage 2026
status: observed; regulated values published by the department; not read by the engine
what_it_is: >-
  The regulated price of petrol and diesel in each Magisterial District Zone is the coastal basic price plus a zone
  differential. The department describes the differentials as the transport tariffs for moving petrol and diesel by the
  pipeline network and the road network (media statement of 31 March 2026).
method:
- 2024, diesel 0.05% sulphur. Read from the 'Zone Diff.' column of the wholesale price list effective 3 April 2024.
  Every zone is checked: basic price plus differential equals the printed wholesale price.
- 2014, petrol and diesel. Read from the 'Zone differentials' sheet of the transport cost workbook effective 2 April
  2014. Petrol and diesel carry the same differential in every zone.
- Districts by zone are the 'MD by Zone' sheet of the same 2014 workbook.
checks:
- 54 zones in both years, the number the department's statement gives.
- Gauteng (zone 09C) is 33.1 cents a litre in 2014 and 82.8 in April 2024.
limits:
- A regulated allowance in the price, not what a haulier or Transnet charges a shipper.
- The files do not say which mode serves each zone, and the meaning of the zone letters (A, B, C, J) is not stated in them.
- The latest zone list held is April 2024. Later changes are known only for Gauteng (91.1 from 1 April 2026).
- The district list is from 2014; two zones with a 2024 differential (10A and 60C) have no district in it.
