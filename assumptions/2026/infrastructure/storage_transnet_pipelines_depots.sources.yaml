transcription: >
  Typed by hand from the "Description of Assets" section of each RFP.
  Capacities given in cubic metres were converted at 1 m3 = 1 000 litres.

totals_by_facility_litres:
  Ladysmith Fuel Storage Facility: 9014000      # the RFP states 9 014 m3; the rows add to the same
  Standerton Petroleum Depot: 2353000           # sum of the three stated tanks
  Kroonstad Liquid Petroleum Depot: 3300000     # "approximately 3.3 million litres"
  Bethlehem Liquid Petroleum Depot: null
  Magdala Liquid Petroleum Depot: null

what_each_rfp_says:
  Ladysmith: >
    Six accumulator tanks from the Durban-Johannesburg Pipeline system, taken
    out of service in March 2018 and not maintained since. Not linked to the
    multi-product pipeline and no plan to connect them. No road or rail
    loading, no fire system, pumps or valves. Figures are working capacity.
  Standerton: >
    Purpose-built fuel terminal, formerly on the Durban-Witwatersrand Pipeline;
    stranded since that pipeline was decommissioned. Three accumulator tanks;
    the product each held is not stated.
  Kroonstad: >
    Purpose-built fuel terminal on a site of about 9 350 m2, close to the
    Natref refinery. "4 Storage tanks (approximately 3.3 million litres)";
    individual tank sizes and products are not stated.
  Bethlehem: >
    Pump station and depot infrastructure. The RFP lists a slop tank and water
    tanks but states no product storage capacity.
  Magdala: >
    Pipeline pump station near Kroonstad. The RFP lists water tanks but states
    no product storage capacity.

limits:
  - Two of the five RFPs (Bethlehem, Magdala) give no product storage capacity.
  - >-
    The Ladysmith RFP has a table headed "Table 1 - Tankage Capacity" that is an
    image; the figures here come from the sentence above it, which gives the
    same six tanks.
  - Each RFP has a site layout drawing that may show more detail; not read.
  - These are capacities as stated by the owner for a leasing process, not an
    independent survey, and the Ladysmith and Standerton tanks are out of service.
  - The page will change once the RFP closes. The documents kept in the
    repository are the record of what was published on the retrieval date.
